name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/space.test.js tests/page.test.js tests/i18n.test.js
      - run: node --check web/app.js && node --check web/diagnostics.js && node --check web/i18n.js
      - run: python -m errindex validate
      - run: python -m errindex report
      - run: git diff --exit-code -- data/index.json reports/
      - run: python -m errindex build
